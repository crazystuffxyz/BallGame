<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Rolling Sky - Level Editor & Player</title>
    <style>
        :root {
            --primary: #00f2ff;
            --accent: #ff0077;
            --bg-dark: rgba(10, 16, 32, 0.92);
            --bg-panel: rgba(13, 22, 44, 0.96);
            --border-glow: 0 0 15px rgba(0, 242, 255, 0.4);
        }
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; color: #fff; touch-action: none; }
        #game-canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
        #ui-layer { position: absolute; inset: 0; pointer-events: none; z-index: 10; display: flex; flex-direction: column; justify-content: space-between; }
        
        .interactive { pointer-events: auto !important; }
        .hidden { display: none !important; }

        /* --- HUD --- */
        #hud-top { display: flex; justify-content: space-between; padding: 14px 20px; background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent); pointer-events: auto; }
        #stats-bar { display: flex; gap: 14px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.8); }
        .stat-item { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.5); padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(8px); }
        #progress-container { width: 160px; height: 12px; background: rgba(255,255,255,0.2); border-radius: 10px; border: 1px solid rgba(255,255,255,0.4); overflow: hidden; }
        #progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #00f2ff, #00ff88); box-shadow: 0 0 10px #00f2ff; }
        
        .hud-btn { background: var(--bg-dark); color: var(--primary); border: 1.5px solid var(--primary); padding: 7px 14px; font-weight: 700; border-radius: 8px; cursor: pointer; box-shadow: var(--border-glow); display: flex; align-items: center; gap: 6px; pointer-events: auto; transition: 0.2s; }
        .hud-btn:hover { background: var(--primary); color: #000; transform: translateY(-2px); }
        .hud-btn.primary { background: linear-gradient(135deg, #ff0077, #ff5500); border-color: #ff0077; color: #fff; box-shadow: 0 0 15px rgba(255,0,119,0.6); }
        .hud-btn.primary:hover { background: linear-gradient(135deg, #ff5500, #ff0077); }
        
        #hud-bottom { padding: 16px 20px; display: flex; justify-content: space-between; background: linear-gradient(0deg, rgba(0,0,0,0.7) 0%, transparent); }
        #control-hint { font-size: 13px; color: rgba(255,255,255,0.75); text-shadow: 0 2px 4px rgba(0,0,0,0.8); }

        /* --- Overlays --- */
        .overlay-modal { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); z-index: 200; pointer-events: auto; justify-content: center; align-items: center; }
        .overlay-modal.active { display: flex; }
        .modal-card { background: var(--bg-dark); border: 2px solid var(--primary); border-radius: 16px; padding: 28px 40px; text-align: center; box-shadow: 0 0 40px rgba(0,242,255,0.3); max-width: 400px; width: 90%; }
        .modal-title { font-size: 32px; font-weight: 900; margin-bottom: 12px; letter-spacing: 2px; }
        .modal-title.win { color: #00ff88; text-shadow: 0 0 20px #00ff88; }
        .modal-title.fail { color: #ff0055; text-shadow: 0 0 20px #ff0055; }
        .modal-stats { display: flex; justify-content: space-around; margin: 20px 0; }
        .modal-buttons { display: flex; gap: 14px; justify-content: center; }

        /* --- Editor UI --- */
        #editor-topbar, #editor-bottombar { background: var(--bg-dark); padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; pointer-events: auto; }
        #editor-topbar { border-bottom: 2px solid var(--primary); box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        #editor-bottombar { border-top: 2px solid var(--primary); box-shadow: 0 -4px 20px rgba(0,0,0,0.6); }
        .editor-group { display: flex; align-items: center; gap: 8px; }
        .editor-input { background: #111a2e; color: #fff; border: 1.5px solid var(--primary); padding: 6px 10px; border-radius: 6px; font-weight: 600; outline: none; pointer-events: auto; cursor: pointer; }

        #editor-palette { position: absolute; top: 65px; left: 18px; background: var(--bg-panel); border: 2px solid var(--primary); border-radius: 12px; width: 260px; pointer-events: auto; z-index: 30; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0,0,0,0.8), var(--border-glow); }
        #palette-header { background: linear-gradient(90deg, #162444, #1a2f5a); padding: 8px 12px; display: flex; justify-content: space-between; font-weight: 800; cursor: grab; border-radius: 10px 10px 0 0; color: var(--primary); }
        #palette-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; max-height: max(30vh, calc(100vh - 250px)); overflow-y: auto; }
        .palette-tabs { display: flex; gap: 4px; background: #0d1527; padding: 3px; border-radius: 8px; }
        .tab-btn { flex: 1; background: transparent; border: none; color: #8fa0c0; padding: 6px 2px; font-weight: 700; border-radius: 6px; cursor: pointer; }
        .tab-btn.active { background: var(--primary); color: #000; box-shadow: 0 0 10px var(--primary); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .palette-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
        .tool-btn { background: #152238; border: 1.5px solid rgba(255,255,255,0.15); color: #fff; padding: 7px 4px; border-radius: 6px; font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; pointer-events: auto; }
        .tool-btn.active { background: var(--primary); color: #000; font-weight: 800; border-color: #fff; }

        .json-card { background: var(--bg-dark); border: 2px solid var(--primary); border-radius: 12px; padding: 22px; width: 540px; max-width: 90%; display: flex; flex-direction: column; gap: 12px; }
        #json-textarea { width: 100%; height: 220px; background: #090f1d; border: 1px solid rgba(0,242,255,0.4); color: #00ff88; font-family: monospace; padding: 10px; border-radius: 6px; resize: none; outline: none; }

        /* Mobile */
        @media (max-width: 768px) {
            .hide-mobile { display: none !important; }
            #hud-top { flex-wrap: wrap; padding: 10px; gap: 10px; }
            #stats-bar, #top-controls { width: 100%; justify-content: space-around; }
            .hud-btn { padding: 8px; font-size: 12px; flex-grow: 1; justify-content: center; }
            #editor-palette { top: 110px; left: 6px; width: 220px; }
            #editor-bottombar { flex-direction: column; padding: 8px; }
            .scrubber-wrap, .bottom-controls { width: 100%; justify-content: flex-start; }
        }
    </style>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>
    <div id="ui-layer">
        <!-- Play HUD -->
        <div id="hud-top">
            <div id="stats-bar">
                <div class="stat-item">👑 <span id="crown-count">0/3</span></div>
                <div class="stat-item">💎 <span id="gem-count">0/10</span></div>
                <div class="stat-item"><div id="progress-container"><div id="progress-fill"></div></div><span id="progress-text">0%</span></div>
            </div>
            <div id="top-controls" style="display:flex;gap:10px;">
                <button id="btn-sound" class="hud-btn">🔊 <span class="hide-mobile">Sound</span></button>
                <button id="btn-restart" class="hud-btn">🔄 <span class="hide-mobile">Restart</span></button>
                <button id="btn-mode" class="hud-btn primary">🛠️ Editor</button>
            </div>
        </div>

        <div id="hud-bottom"><div id="control-hint">Controls: <b>Touch / Drag</b> to map ball exactly to finger | <b>A/D</b> to steer | <b>R</b>: Restart</div></div>

        <!-- Editor Overlay -->
        <div id="editor-panel" class="hidden">
            <div id="editor-topbar">
                <div class="editor-group" style="flex:1;">
                    <button id="ed-play" class="hud-btn primary">▶️ Play</button>
                    <button id="ed-start" class="hud-btn">⏮️ Start</button>
                    <select id="ed-preset" class="editor-input hide-mobile">
                        <option value="preset_cloud">Cloud Meadows</option>
                        <option value="preset_cyber">Cyber Matrix</option>
                        <option value="preset_inferno">Inferno Temple</option>
                        <option value="custom">Custom Saved</option>
                    </select>
                    <select id="ed-theme" class="editor-input hide-mobile">
                        <option value="sky">Cloud Sky</option>
                        <option value="cyber">Cyber Synth</option>
                        <option value="inferno">Inferno Temple</option>
                        <option value="cosmos">Deep Cosmos</option>
                    </select>
                    <input type="number" id="ed-tempo" class="editor-input hide-mobile" min="2" max="40" step="0.5" value="11" style="width:60px;" title="Start Tempo">
                </div>
                <div class="editor-group" style="flex:0 0 auto;">
                    <button id="ed-save" class="hud-btn">💾 <span class="hide-mobile">Save</span></button>
                    <button id="ed-json" class="hud-btn">📋 <span class="hide-mobile">JSON</span></button>
                    <button id="ed-clear" class="hud-btn" style="border-color:#ff0055;color:#ff0055;">🗑️ <span class="hide-mobile">Clear</span></button>
                </div>
            </div>

            <div id="editor-palette">
                <div id="palette-header">🎨 PALETTE <button id="palette-min" class="palette-header-btn">_</button></div>
                <div id="palette-body">
                    <div class="palette-tabs">
                        <button class="tab-btn active" data-target="tab-tiles">Tiles</button>
                        <button class="tab-btn" data-target="tab-obs">Obstacles</button>
                        <button class="tab-btn" data-target="tab-tempo">Tempo</button>
                    </div>
                    <div id="tab-tiles" class="tab-content active"><div class="palette-grid">
                        <button class="tool-btn active" data-cat="tile" data-val="1">⬜ Normal</button>
                        <button class="tool-btn" data-cat="tile" data-val="2">🔼 Jump Pad</button>
                        <button class="tool-btn" data-cat="tile" data-val="3">⏫ Big Jump</button>
                        <button class="tool-btn" data-cat="tile" data-val="4">🪟 Glass</button>
                        <button class="tool-btn" data-cat="tile" data-val="5">⚡ Speed Up</button>
                        <button class="tool-btn" data-cat="tile" data-val="6">🛑 Speed Down</button>
                        <button class="tool-btn" data-cat="tile" data-val="7">✨ Fade Tile</button>
                        <button class="tool-btn" data-cat="tile" data-val="0">⬛ Void (Erase)</button>
                    </div></div>
                    <div id="tab-obs" class="tab-content"><div class="palette-grid">
                        <button class="tool-btn" data-cat="obs" data-val="1">🌲 Tree</button>
                        <button class="tool-btn" data-cat="obs" data-val="2">🔺 Pyramid</button>
                        <button class="tool-btn" data-cat="obs" data-val="3">⚡ Laser Gate</button>
                        <button class="tool-btn" data-cat="obs" data-val="4">🔨 Hammer</button>
                        <button class="tool-btn" data-cat="obs" data-val="5">📦 Drop Block</button>
                        <button class="tool-btn" data-cat="obs" data-val="6">💎 Diamond</button>
                        <button class="tool-btn" data-cat="obs" data-val="7">👑 Crown</button>
                        <button class="tool-btn" data-cat="obs" data-val="0">❌ Erase Obs</button>
                    </div></div>
                    <div id="tab-tempo" class="tab-content" style="text-align:center;">
                        <input type="number" id="ed-tempo-val" class="editor-input" min="2" max="40" step="0.5" value="15" style="width:100%;margin-bottom:8px;">
                        <button class="tool-btn" data-cat="tile" data-val="8" style="width:100%;padding:10px;">🎵 Place Tempo Tile</button>
                    </div>
                </div>
            </div>

            <div id="editor-bottombar">
                <div class="scrubber-wrap">
                    <button class="step-btn" data-dir="-10">-10</button>
                    <button class="step-btn" data-dir="-1">-1</button>
                    <input type="range" id="ed-slider" min="0" max="120" value="0">
                    <button class="step-btn" data-dir="1">+1</button>
                    <button class="step-btn" data-dir="10">+10</button>
                    <span id="ed-row-disp">Row: 0</span>
                </div>
                <div class="editor-group bottom-controls">
                    <button id="ed-mode-paint" class="hud-btn primary">🖌️ Paint Mode</button>
                </div>
            </div>
        </div>

        <!-- Modals -->
        <div id="modal-end" class="overlay-modal">
            <div class="modal-card">
                <div id="end-title" class="modal-title win">COMPLETE!</div>
                <div class="modal-stats">
                    <div><div style="font-size:11px;color:#888;">GEMS</div><div id="end-gems" style="font-size:22px;color:#00f2ff;font-weight:bold;">0/10</div></div>
                    <div><div style="font-size:11px;color:#888;">CROWNS</div><div id="end-crowns" style="font-size:22px;color:#ffbb00;font-weight:bold;">0/3</div></div>
                </div>
                <div class="modal-buttons">
                    <button id="btn-retry" class="hud-btn primary">🔄 Play Again</button>
                </div>
            </div>
        </div>
        <div id="modal-json" class="overlay-modal">
            <div class="json-card">
                <h3>Level JSON</h3>
                <textarea id="json-io"></textarea>
                <div style="display:flex;gap:10px;justify-content:flex-end;">
                    <button id="btn-json-copy" class="hud-btn">📋 Copy</button>
                    <button id="btn-json-load" class="hud-btn primary">📥 Load</button>
                    <button id="btn-json-close" class="hud-btn">✕ Close</button>
                </div>
            </div>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';

        // ==========================================
        // MODULE 1: Data Constants & Themes
        // ==========================================
        const THEMES = {
            sky: { fog: 0xa0c4ff, cMain: '#3a88fe', cSub: '#235bb5', cBord: '#00f2ff', accent: 0x00f2ff, light: 0xffffff },
            cyber: { fog: 0x1f062e, cMain: '#2d0c4e', cSub: '#18042b', cBord: '#ff00aa', accent: 0xff00aa, light: 0xffaaff },
            inferno: { fog: 0x240606, cMain: '#401010', cSub: '#240808', cBord: '#ff4400', accent: 0xff3b00, light: 0xff8844 },
            cosmos: { fog: 0x070b1a, cMain: '#0d1f3d', cSub: '#081224', cBord: '#7000ff', accent: 0x7000ff, light: 0x88bbff }
        };

        const Storage = {
            key: 'rs_level_data',
            save: d => localStorage.setItem(Storage.key, JSON.stringify(d)),
            load: () => { try { return JSON.parse(localStorage.getItem(Storage.key)); } catch(e){ return null; } }
        };

        function makePreset(type) {
            return Array.from({length: 120}, (_, r) => {
                let t = [0,0,0,0,0], o = [0,0,0,0,0];
                if (r < 6 || r === 119) t = [1,1,1,1,1];
                else {
                    const p = r % 16;
                    if(type === 1) { t = p < 4 ? [0,1,1,1,0] : p < 8 ? [1,1,1,0,0] : p < 12 ? [0,0,1,1,1] : [0,1,1,1,0]; if(p===6) o[0]=1; if(r%11===0) o[2]=6; }
                    else if(type === 2) { t = [1,1,1,1,1]; if(p===0) t[1]=4; if(r%12===0) o[2]=3; if(r%9===0) o[2]=6; }
                    else { t = p < 2 ? [1,1,0,0,0] : p < 4 ? [0,1,1,1,0] : p < 6 ? [0,0,0,1,1] : [0,1,1,1,0]; if(r%7===0) o[2]=4; if(r%8===0) o[2]=6; }
                }
                return { tiles: t, obstacles: o, tileTempo: [0,0,0,0,0] };
            });
        }
        const PRESETS = {
            preset_cloud: { theme: 'sky', baseTempo: 11, rows: makePreset(1) },
            preset_cyber: { theme: 'cyber', baseTempo: 13, rows: makePreset(2) },
            preset_inferno: { theme: 'inferno', baseTempo: 14.5, rows: makePreset(3) }
        };

        // ==========================================
        // MODULE 2: Sound Engine (Refactored)
        // ==========================================
        class SoundEngine {
            constructor() { this.ctx = null; this.muted = false; this.musicTimer = null; this.step = 0; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); }
            play(type, f1, f2, dur, vol, vol2=0.0001, tOff=0) {
                if(this.muted || !this.ctx) return;
                try {
                    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime + tOff;
                    o.type = type; o.frequency.setValueAtTime(f1, t);
                    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
                    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(vol2, t + dur);
                    o.connect(g); g.connect(this.ctx.destination);
                    o.start(t); o.stop(t + dur + 0.05);
                } catch(e){}
            }
            playTone(f, type='sine', d=0.15, v=0.2) { this.play(type, f, null, d, v); }
            playJump() { this.play('triangle', 220, 700, 0.25, 0.3); }
            playSpeed() { this.play('sawtooth', 300, 900, 0.2, 0.15); }
            playGem() { [880, 1174.66, 1760].forEach((f, i) => this.play('sine', f, null, 0.2, 0.2, 0.0001, i*0.05)); }
            playCrown() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => this.play('triangle', f, null, 0.4, 0.25, 0.0001, i*0.07)); }
            playCrash() {
                if(this.muted || !this.ctx) return;
                const bs = this.ctx.sampleRate * 0.35, buf = this.ctx.createBuffer(1, bs, this.ctx.sampleRate), d = buf.getChannelData(0);
                for (let i=0; i<bs; i++) d[i] = (Math.random()*2-1) * Math.exp(-i/(bs*0.25));
                const n = this.ctx.createBufferSource(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
                n.buffer = buf; f.type = 'lowpass'; f.frequency.setValueAtTime(600, this.ctx.currentTime); f.frequency.linearRampToValueAtTime(80, this.ctx.currentTime+0.35);
                g.gain.setValueAtTime(0.5, this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime+0.35);
                n.connect(f); f.connect(g); g.connect(this.ctx.destination); n.start();
            }
            startMusic() {
                if (this.isPlayingMusic || this.muted) return;
                this.init(); this.isPlayingMusic = true; this.step = 0;
                const bScale = [110, 110, 130.81, 146.83, 110, 98.00, 110, 164.81], lScale = [440, 523.25, 587.33, 659.25, 783.99, 880];
                this.musicTimer = setInterval(() => {
                    if (this.muted) return;
                    if (this.step%4===0) this.playTone(120, 'sine', 0.12, 0.35);
                    if (this.step%8===4) this.playTone(280, 'triangle', 0.08, 0.18);
                    if (this.step%2===0) this.playTone(bScale[(this.step/2)%bScale.length], 'sawtooth', 0.1, 0.12);
                    if (this.step%4===2 && Math.random()>0.3) this.playTone(lScale[Math.floor(Math.random()*lScale.length)], 'sine', 0.18, 0.1);
                    this.step = (this.step + 1) % 32;
                }, (60/135)*1000/4);
            }
            stopMusic() { this.isPlayingMusic = false; clearInterval(this.musicTimer); }
            toggle() { this.muted = !this.muted; if(this.muted) this.stopMusic(); else this.startMusic(); return this.muted; }
        }

        // ==========================================
        // MODULE 3: Graphics & Level Generation
        // ==========================================
        const TexGen = {
            make(w, h, drawFn) {
                const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
                drawFn(cv.getContext('2d'), w, h); return new THREE.CanvasTexture(cv);
            }
        };
        const Materials = {
            getSky(t) { return TexGen.make(512, 512, (ctx, w, h) => {
                const g = ctx.createLinearGradient(0,0,0,h);
                if(t==='sky'){ g.addColorStop(0,'#5fa8ff'); g.addColorStop(1,'#e8f4f8'); }
                else if(t==='cyber'){ g.addColorStop(0,'#09051d'); g.addColorStop(1,'#ff0077'); }
                else if(t==='inferno'){ g.addColorStop(0,'#1a0505'); g.addColorStop(1,'#ff3b00'); }
                else { g.addColorStop(0,'#020008'); g.addColorStop(1,'#1b2a6b'); }
                ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
                if(t==='cosmos'||t==='cyber') for(let i=0;i<150;i++){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(Math.random()*w,Math.random()*h,Math.random()*1.5,0,7); ctx.fill(); }
            }); },
            getFloor(c1, c2, cb) { return TexGen.make(128, 128, ctx => {
                ctx.fillStyle=c1; ctx.fillRect(0,0,128,128); ctx.fillStyle=c2; ctx.fillRect(8,8,112,112);
                ctx.lineWidth=6; ctx.strokeStyle=cb; ctx.strokeRect(3,3,122,122); ctx.fillStyle=cb;
                [0,118].forEach(x => [0,118].forEach(y => ctx.fillRect(x,y,10,10)));
            }); },
            getJump(c) { return TexGen.make(128, 128, ctx => {
                ctx.fillStyle=c; ctx.fillRect(0,0,128,128); ctx.lineWidth=6; ctx.strokeStyle='#fff'; ctx.strokeRect(4,4,120,120); ctx.fillStyle='#fff';
                [80,50,20].forEach(y => { ctx.beginPath(); ctx.moveTo(64,y); ctx.lineTo(96,y+24); ctx.lineTo(82,y+24); ctx.lineTo(64,y+10); ctx.lineTo(46,y+24); ctx.lineTo(32,y+24); ctx.fill(); });
            }); },
            getSpeed(c) { return TexGen.make(128, 128, ctx => {
                ctx.fillStyle=c; ctx.fillRect(0,0,128,128); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(64,20); ctx.lineTo(100,70); ctx.lineTo(76,70); ctx.lineTo(76,108); ctx.lineTo(52,108); ctx.lineTo(52,70); ctx.lineTo(28,70); ctx.fill();
            }); },
            getGlass() { return TexGen.make(128, 128, ctx => {
                ctx.fillStyle='rgba(180,230,255,0.4)'; ctx.fillRect(0,0,128,128); ctx.lineWidth=4; ctx.strokeStyle='#fff'; ctx.strokeRect(2,2,124,124); ctx.beginPath(); ctx.moveTo(10,10); ctx.lineTo(60,70); ctx.lineTo(110,40); ctx.moveTo(60,70); ctx.lineTo(50,120); ctx.stroke();
            }); }
        };

        class LevelManager {
            constructor(scene) {
                this.scene = scene;
                this.grid = new THREE.Group(); this.obs = new THREE.Group(); this.decor = new THREE.Group();
                scene.add(this.grid, this.obs, this.decor);
                this.geo = {
                    tile: new THREE.BoxGeometry(2, 0.4, 2), pyr: new THREE.ConeGeometry(0.8, 1.8, 4),
                    trunk: new THREE.CylinderGeometry(0.2, 0.3, 0.8, 8), fol: new THREE.ConeGeometry(0.9, 1.6, 6),
                    lp: new THREE.CylinderGeometry(0.1, 0.1, 2.5, 8), lb: new THREE.CylinderGeometry(0.08, 0.08, 2, 8),
                    ham: new THREE.BoxGeometry(1.6, 0.8, 0.8), gem: new THREE.OctahedronGeometry(0.45, 0), crown: new THREE.CylinderGeometry(0.5, 0.3, 0.4, 5, 1, true)
                };
                this.mats = {}; this.anim = []; this.glass = new Map();
            }
            updateMats(tk) {
                const t = THEMES[tk] || THEMES.sky;
                const mk = (p) => new THREE.MeshStandardMaterial(p);
                const floorMap = Materials.getFloor(t.cMain, t.cSub, t.cBord); floorMap.wrapS=floorMap.wrapT=THREE.RepeatWrapping;
                this.mats = {
                    floor: mk({map: floorMap, roughness:0.3, metalness:0.2}),
                    j1: mk({map: Materials.getJump('#ff0055'), emissive:0xff0055, emissiveIntensity:0.6}),
                    j2: mk({map: Materials.getJump('#ffaa00'), emissive:0xffaa00, emissiveIntensity:0.8}),
                    glass: mk({map: Materials.getGlass(), transparent:true, opacity:0.7}),
                    sUp: mk({map: Materials.getSpeed('#00ff88'), emissive:0x00ff88, emissiveIntensity:0.5}),
                    sDn: mk({map: Materials.getSpeed('#ff2200'), emissive:0xff2200, emissiveIntensity:0.5}),
                    fade: mk({color: t.accent, emissive: t.accent, emissiveIntensity:0.4, transparent:true, opacity:0.8}),
                    pyr: mk({color: t.accent, emissive: t.accent, emissiveIntensity:0.4, roughness:0.2}),
                    tF: mk({color: 0x117733}), tT: mk({color: 0x553311}),
                    laser: new THREE.MeshBasicMaterial({color: 0x00f2ff}),
                    ham: mk({color: 0x444455, metalness:0.8}),
                    gem: mk({color: 0x00ffff, emissive:0x00ffff, emissiveIntensity:0.8, metalness:0.9}),
                    crn: mk({color: 0xffbb00, emissive:0xff8800, emissiveIntensity:0.7, metalness:0.8, side: THREE.DoubleSide})
                };
                this.decor.clear();
                const cg = new THREE.DodecahedronGeometry(4, 1), cm = mk({color:0xffffff, roughness:1, transparent:true, opacity:0.7});
                for(let i=0; i<30; i++) {
                    const c = new THREE.Mesh(cg, cm);
                    c.position.set((Math.random()-0.5)*80 + (Math.random()>0.5?25:-25), (Math.random()-0.5)*20-5, -i*15-20);
                    c.scale.setScalar(Math.random()*2+1); this.decor.add(c);
                }
            }
            load(d) {
                this.data = d; this.updateMats(d.theme); this.rebuild();
            }
            rebuild() {
                this.grid.clear(); this.obs.clear(); this.anim = []; this.glass.clear();
                if(!this.data?.rows) return;
                const tw = 2, td = 2, base = this.data.baseTempo || 11;
                this.data.rows.forEach((r, rowIdx) => {
                    const z = -rowIdx * td;
                    for(let c=0; c<5; c++) {
                        const x = (c-2) * tw, type = r.tiles[c], ot = r.obstacles[c];
                        if(type > 0) {
                            let m = this.mats.floor;
                            if(type===2) m = this.mats.j1; else if(type===3) m = this.mats.j2;
                            else if(type===4) m = this.mats.glass; else if(type===5) m = this.mats.sUp;
                            else if(type===6) m = this.mats.sDn; else if(type===7) m = this.mats.fade;
                            const mesh = new THREE.Mesh(this.geo.tile, m);
                            mesh.position.set(x, -0.2, z); mesh.userData = {r:rowIdx, c, type};
                            this.grid.add(mesh);
                        }
                        if(ot > 0) {
                            const grp = new THREE.Group(); group.position.set(x, 0, z); grp.userData = {type:ot, col:false};
                            const addP = (m, y, ry=0) => { m.position.y=y; m.rotation.y=ry; grp.add(m); };
                            if(ot===1) { addP(new THREE.Mesh(this.geo.trunk, this.mats.tT), 0.4); addP(new THREE.Mesh(this.geo.fol, this.mats.tF), 1.4); grp.userData.hr=0.7; grp.userData.hh=2.2; }
                            else if(ot===2) { addP(new THREE.Mesh(this.geo.pyr, this.mats.pyr), 0.9, Math.PI/4); grp.userData.hr=0.7; grp.userData.hh=1.8; }
                            else if(ot===3) { 
                                const p1=new THREE.Mesh(this.geo.lp, this.mats.ham), p2=new THREE.Mesh(this.geo.lp, this.mats.ham), b=new THREE.Mesh(this.geo.lb, this.mats.laser);
                                p1.position.set(-0.9, 1.25, 0); p2.position.set(0.9, 1.25, 0); b.position.set(0, 1.2, 0); b.rotation.z=Math.PI/2;
                                grp.add(p1,p2,b); grp.userData.hr=0.9; grp.userData.hh=2;
                            }
                            else if(ot===4) {
                                const st=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,2.5), this.mats.ham), hd=new THREE.Mesh(this.geo.ham, this.mats.ham);
                                st.position.y=1.5; hd.position.y=2.7; grp.add(st,hd); grp.userData.hr=0.8; grp.userData.hh=3;
                                this.anim.push({m:grp, t:'h', s:2.5, p:rowIdx*0.5});
                            }
                            else if(ot===6) { addP(new THREE.Mesh(this.geo.gem, this.mats.gem), 0.75); grp.userData.hr=0.8; grp.userData.item=1; this.anim.push({m:grp, t:'s', s:3}); }
                            else if(ot===7) { addP(new THREE.Mesh(this.geo.crown, this.mats.crn), 0.75); grp.userData.hr=0.9; grp.userData.item=2; this.anim.push({m:grp, t:'s', s:2}); }
                            this.obs.add(grp);
                        }
                    }
                });
            }
            update(delta) {
                const t = performance.now()*0.001;
                this.anim.forEach(a => {
                    if(a.t==='s') { a.m.rotation.y += a.s*delta; a.m.position.y = Math.sin(t*3 + a.m.position.z)*0.15; }
                    if(a.t==='h') { a.m.rotation.z = Math.sin(t*a.s + a.p)*0.8; }
                });
                this.glass.forEach((d, m) => { d.e+=delta; if(d.e>0.2){ m.position.y-=delta*15; m.rotation.x+=delta*2; }});
                this.mats.fade.opacity = (Math.sin(t*4)+1)/2 > 0.4 ? 0.9 : 0.1;
            }
            trigGlass(m) { if(!this.glass.has(m)) this.glass.set(m, {e:0}); }
        }

        // ==========================================
        // MODULE 4: Player Controller (Physics)
        // ==========================================
        class Player {
            constructor(scene, sound) {
                this.snd = sound; this.r = 0.78; // Ball 1.3x Larger
                this.pos = new THREE.Vector3(0, this.r, 0); this.tX = 0; this.cX = 0; this.vY = 0;
                this.spd = 11; this.dead = false; this.fall = false; this.jump = false;
                
                const cv = document.createElement('canvas'); cv.width=128; cv.height=64; const ctx=cv.getContext('2d');
                ctx.fillStyle='#fff'; ctx.fillRect(0,0,128,64); ctx.fillStyle='#ff0055'; ctx.fillRect(0,0,64,32); ctx.fillRect(64,32,64,32);
                this.mesh = new THREE.Mesh(new THREE.SphereGeometry(this.r,32,32), new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(cv), roughness:0.2, metalness:0.3}));
                
                // Shadow radius scales up with the ball. Margin factor 0.45 -> 1/4 area precision.
                const sg = new THREE.CircleGeometry(this.r * 0.45, 24); sg.rotateX(-Math.PI/2);
                this.shadow = new THREE.Mesh(sg, new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:0.45}));
                scene.add(this.mesh, this.shadow);
            }
            reset(row, tpo) {
                this.pos.set(0, this.r, -row*2); this.tX=0; this.cX=0; this.vY=0; this.spd=tpo||11;
                this.dead=false; this.fall=false; this.jump=false; this.mesh.visible=this.shadow.visible=true;
            }
            doJump(p=12) { if(!this.fall){ this.vY=p; this.jump=true; this.snd.playJump(); } }
            update(dt, lvl) {
                if(this.dead) return;
                const fw = this.spd * 2 * dt; this.pos.z -= fw;
                this.cX += (this.tX - this.cX) * 20 * dt; this.pos.x = Math.max(-5.5, Math.min(5.5, this.cX));
                this.mesh.rotation.x -= fw/this.r; this.mesh.rotation.z = -(this.tX-this.cX)*1.5;

                let onG = false, pT = 0, touchR = -1, touchC = -1;
                const sR = this.r * 0.45; // Shadow collision margin

                if(lvl.data?.rows) {
                    const rs = lvl.data.rows;
                    const rMin = Math.max(0, Math.floor((-this.pos.z - sR + 1) / 2)), rMax = Math.min(rs.length-1, Math.floor((-this.pos.z + sR + 1) / 2));
                    const cMin = Math.max(0, Math.floor((this.pos.x - sR + 5) / 2)), cMax = Math.min(4, Math.floor((this.pos.x + sR + 5) / 2));
                    
                    let bestD = Infinity;
                    for(let r=rMin; r<=rMax; r++) {
                        for(let c=cMin; c<=cMax; c++) {
                            const t = rs[r].tiles[c]; if(!t) continue;
                            const tX = (c-2)*2, tZ = -r*2;
                            const dSq = Math.pow(this.pos.x - Math.max(tX-1, Math.min(this.pos.x, tX+1)), 2) + Math.pow(this.pos.z - Math.max(tZ-1, Math.min(this.pos.z, tZ+1)), 2);
                            
                            if(dSq <= sR*sR) {
                                let s = true;
                                if(t===4) { const m = lvl.grid.children.find(m=>m.userData.r===r && m.userData.c===c); if(m && m.position.y<-0.3) s=false; }
                                else if(t===7) s = lvl.mats.fade.opacity > 0.4;
                                if(s) { onG = true; if(dSq<bestD) { bestD = dSq; pT = t; touchR = r; touchC = c; } }
                            }
                        }
                    }
                    if(this.pos.z <= -(rs.length-1)*2 && !onG && rs[rs.length-1].tiles.some(t=>t>0)) onG = true;
                }

                const fx = () => {
                    if(pT===2) this.doJump(13.5); else if(pT===3) this.doJump(18);
                    else if(pT===5){ this.spd=Math.min(40, this.spd*1.45); this.snd.playSpeed(); }
                    else if(pT===6) this.spd=Math.max(2, this.spd*0.85);
                    else if(pT===4) { const m = lvl.grid.children.find(m=>m.userData.r===touchR && m.userData.c===touchC); if(m) lvl.trigGlass(m); }
                };

                if(!this.jump && !onG) this.fall = true;

                if(this.fall) { this.vY -= 42*dt; this.pos.y += this.vY*dt; }
                else if(this.jump) {
                    this.vY -= 34*dt; this.pos.y += this.vY*dt;
                    if(this.pos.y <= this.r && this.vY <= 0) {
                        if(onG){ this.pos.y = this.r; this.vY = 0; this.jump = false; fx(); }
                        else { this.jump = false; this.fall = true; }
                    }
                } else { this.pos.y = this.r; this.vY = 0; fx(); }

                if(this.pos.y < -3.5) this.crash("fall");
                
                this.mesh.position.copy(this.pos);
                this.shadow.position.set(this.pos.x, 0.02, this.pos.z);
                const ss = Math.max(0.2, 1 - (this.pos.y - this.r)*0.15);
                this.shadow.scale.set(ss,ss,ss); this.shadow.visible = !this.fall && this.pos.y > -0.5;
            }
            crash(r="obs") { if(this.dead) return; this.dead = true; this.snd.playCrash(); this.mesh.visible=this.shadow.visible=false; window.game.end(r); }
        }

        // ==========================================
        // MODULE 5: Editor Controller
        // ==========================================
        class Editor {
            constructor(g) { this.g = g; this.act = false; this.c = 0; this.tCat = 'tile'; this.tVal = 1; this.mode = 'paint'; this.paint = this.pan = false; this.init(); }
            init() {
                const el = (id) => document.getElementById(id);
                // Bind Top/Bottom UI mapped interactions
                el('ed-mode-paint').onclick = () => { this.mode = this.mode==='paint'?'pan':'paint'; el('ed-mode-paint').innerHTML = this.mode==='paint'?'🖌️ Paint Mode':'✋ Pan Mode'; };
                el('ed-slider').oninput = (e) => this.scrTo(e.target.value);
                document.querySelectorAll('.step-btn').forEach(b => b.onclick = (e) => this.scrTo(this.c + parseInt(e.target.dataset.dir)));
                document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => { document.querySelectorAll('.tab-btn, .tab-content').forEach(x=>x.classList.remove('active')); b.classList.add('active'); el(b.dataset.target).classList.add('active'); });
                document.querySelectorAll('.tool-btn').forEach(b => b.onclick = () => { document.querySelectorAll('.tool-btn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); this.tCat = b.dataset.cat; this.tVal = parseInt(b.dataset.val); });
                
                // Track interaction
                const cv = el('game-canvas');
                cv.addEventListener('pointerdown', e => { if(!this.act) return; if(e.button===2 || this.mode==='pan'){ this.pan=true; this.pY=e.clientY; this.pR=this.c; } else { this.paint=true; this.doP(false); } });
                cv.addEventListener('pointermove', e => { if(!this.act) return; if(this.pan){ this.scrTo(this.pR + Math.round((e.clientY-this.pY)/15)); return; } this.upDHov(e); if(this.paint) this.doP(e.buttons===2); });
                window.addEventListener('pointerup', () => { this.paint=this.pan=false; });
                cv.addEventListener('contextmenu', e=>e.preventDefault());
                
                this.hov = new THREE.Mesh(new THREE.BoxGeometry(2,0.45,2), new THREE.MeshBasicMaterial({color:0x00f2ff, wireframe:true})); this.hov.visible=false; this.g.scene.add(this.hov);
            }
            toggle(a) { this.act = a; this.hov.visible = a; document.getElementById('editor-panel').classList.toggle('hidden', !a); if(a) this.scrTo(this.c); }
            scrTo(r) { this.c = Math.max(0, Math.min(119, r)); document.getElementById('ed-slider').value = this.c; document.getElementById('ed-row-disp').innerText = `Row: ${this.c}/119`; const z = -this.c*2; this.g.cam.position.set(0,8,z+5.5); this.g.cam.lookAt(0,0,z-2.5); }
            upDHov(e) {
                const rc = new THREE.Raycaster(); rc.setFromCamera(new THREE.Vector2((e.clientX/window.innerWidth)*2-1, -(e.clientY/window.innerHeight)*2+1), this.g.cam);
                const t = new THREE.Vector3(); rc.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0), t);
                if(t) { const c = Math.round(t.x/2), r = Math.round(-t.z/2); if(c>=-2 && c<=2 && r>=0 && r<120){ this.hov.position.set(c*2,0,-r*2); this.hov.visible=true; this.hR=r; this.hC=c+2; return; } }
                this.hov.visible=false; this.hR=null;
            }
            doP(erase) {
                if(this.hR===null) return; const row = this.g.lvl.data.rows[this.hR];
                if(this.tCat==='tile') row.tiles[this.hC] = erase ? 0 : this.tVal;
                else if(this.tCat==='obs') row.obstacles[this.hC] = erase ? 0 : this.tVal;
                this.g.lvl.rebuild();
            }
        }

        // ==========================================
        // MODULE 6: Main Game Logic
        // ==========================================
        class Game {
            constructor() {
                this.mode = 'play'; this.snd = new SoundEngine(); this.clk = new THREE.Clock();
                this.init3D(); this.lvl = new LevelManager(this.scene); this.p = new Player(this.scene, this.snd); this.ed = new Editor(this);
                this.bindUI(); this.loadPreset('preset_cloud'); this.loop();
            }
            init3D() {
                this.scene = new THREE.Scene(); this.cam = new THREE.PerspectiveCamera(62, window.innerWidth/window.innerHeight, 0.1, 1000);
                this.rnd = new THREE.WebGLRenderer({canvas: document.getElementById('game-canvas'), antialias:true}); this.rnd.setSize(window.innerWidth, window.innerHeight);
                this.dl = new THREE.DirectionalLight(0xffffff, 1.25); this.dl.position.set(18, 30, 18); this.scene.add(new THREE.AmbientLight(0xffffff, 0.85), this.dl);
            }
            bindUI() {
                const el = id => document.getElementById(id);
                // Unified pointer input. Map absolute Screen X -> Track [-5.0, 5.0]
                let d = false;
                const updX = cx => { if(this.mode==='play') this.p.tX = (cx/window.innerWidth)*10 - 5; };
                window.addEventListener('pointerdown', e => { if(e.target.tagName !== 'BUTTON') { d=true; this.snd.init(); updX(e.clientX); }});
                window.addEventListener('pointermove', e => { if(d) updX(e.clientX); });
                window.addEventListener('pointerup', () => d=false);
                window.addEventListener('keydown', e => { if(e.code==='KeyA'||e.code==='ArrowLeft') this.p.tX-=1.5; if(e.code==='KeyD'||e.code==='ArrowRight') this.p.tX+=1.5; if(e.code==='KeyR') this.restart(); if(e.code==='Space'&&this.mode==='editor') this.start(this.ed.c); });
                
                el('btn-mode').onclick = () => this.setMode(this.mode==='play'?'editor':'play');
                el('btn-sound').onclick = () => el('btn-sound').innerHTML = this.snd.toggle() ? "🔇 Muted" : "🔊 Sound";
                el('btn-restart').onclick = el('btn-retry').onclick = () => { el('modal-end').classList.remove('active'); this.restart(); };
            }
            setTheme(k) { const t = THEMES[k]||THEMES.sky; this.scene.background = Materials.getSky(k); this.scene.fog = new THREE.Fog(t.fog, 20, 110); this.dl.color.setHex(t.light); this.lvl.updateMats(k); if(this.lvl.data) this.lvl.data.theme=k; }
            loadPreset(k) { const p = PRESETS[k]; if(!p) return; this.lvl.load(JSON.parse(JSON.stringify(p))); this.setTheme(p.theme); document.getElementById('ed-theme').value=p.theme; }
            setMode(m) { this.mode = m; const play = m==='play'; this.snd.stopMusic(); this.p.mesh.visible=this.p.shadow.visible=play; this.ed.toggle(!play); document.getElementById('hud-top').style.display=play?'flex':'none'; if(play) this.restart(); }
            start(r=0) { this.setMode('play'); this.p.reset(r, this.lvl.data.baseTempo); this.snd.startMusic(); }
            restart() { this.g = this.c = 0; this.updHUD(); this.p.reset(0, this.lvl.data.baseTempo); this.lvl.rebuild(); this.snd.startMusic(); }
            end(r) { this.snd.stopMusic(); setTimeout(()=>{ document.getElementById('end-title').innerText = r==='fall'?"FELL IN THE VOID!":"CRASHED!"; document.getElementById('end-title').className = "modal-title fail"; this.showEnd(); }, 600); }
            showEnd() { document.getElementById('end-gems').innerText=`${this.g}/10`; document.getElementById('end-crowns').innerText=`${this.c}/3`; document.getElementById('modal-end').classList.add('active'); }
            updHUD() { document.getElementById('gem-count').innerText=`${this.g}/10`; document.getElementById('crown-count').innerText=`${this.c}/3`; }
            
            loop() {
                const dt = Math.min(0.05, this.clk.getDelta());
                if(this.mode==='play') {
                    this.p.update(dt, this.lvl); this.lvl.update(dt);
                    
                    // Collision
                    const rOff = this.p.r - 0.6;
                    this.lvl.obs.children.forEach(c => {
                        if(!c.userData.col && c.position.distanceTo(this.p.pos) < c.userData.hr + rOff) {
                            if(c.userData.item) { c.userData.col=true; c.visible=false; if(c.userData.item===2){ this.c++; this.snd.playCrown(); } else { this.g++; this.snd.playGem(); } this.updHUD(); }
                            else if(Math.abs(this.p.pos.y-c.position.y) < c.userData.hh) this.p.crash();
                        }
                    });

                    // Translates Camera by 0.5x ball pos, rather than tilting heavily
                    this.cam.position.set(this.p.pos.x * 0.5, Math.max(4.5, this.p.pos.y + 8), this.p.pos.z + 5.5);
                    this.cam.lookAt(this.p.pos.x * 0.5, Math.max(0, this.p.pos.y * 0.35), this.p.pos.z - 2.5);

                    const tr = this.lvl.data.rows.length, cur = Math.min(tr, Math.max(0, -this.p.pos.z/2)), pct = Math.min(100, Math.floor((cur/(tr-1))*100));
                    document.getElementById('progress-fill').style.width = `${pct}%`; document.getElementById('progress-text').innerText = `${pct}%`;
                    if(cur >= tr-1 && !this.p.dead) { this.snd.stopMusic(); this.snd.playCrown(); document.getElementById('end-title').innerText="COMPLETE!"; document.getElementById('end-title').className="modal-title win"; this.showEnd(); }
                } else this.lvl.update(dt);
                this.rnd.render(this.scene, this.cam); requestAnimationFrame(()=>this.loop());
            }
        }
        window.game = new Game();
    </script>
</body>
